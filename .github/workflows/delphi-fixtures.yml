name: Delphi Parser Fixtures

on:
  pull_request:
    paths:
      - 'packages/delphi-parser/**'
      - '.github/workflows/delphi-fixtures.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delphi-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build parser
        run: pnpm --filter @gestor/delphi-parser build

      - name: Validate component catalog
        run: pnpm --filter @gestor/delphi-parser validate:components

      - name: Audit fixture DFM components
        run: pnpm --filter @gestor/delphi-parser validate:fixture-components

      - name: Validate generated fixture artifacts
        run: |
          pnpm --filter @gestor/delphi-parser validate:fixture:produtos
          pnpm --filter @gestor/delphi-parser validate:fixture:parceiros
          pnpm --filter @gestor/delphi-parser validate:fixture:grupo-produtos
          pnpm --filter @gestor/delphi-parser validate:fixture:grupo-parceiros
