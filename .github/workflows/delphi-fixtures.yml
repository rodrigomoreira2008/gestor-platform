name: Delphi Parser Fixtures

on:
  pull_request:
    paths:
      - 'packages/delphi-parser/**'
      - 'docs/generator/**'
      - '.github/workflows/delphi-fixtures.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delphi-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Diagnose parser environment
        run: pnpm --filter @gestor/delphi-parser doctor

      - name: Validate package metadata
        run: pnpm --filter @gestor/delphi-parser validate:package

      - name: Validate package scripts
        run: pnpm --filter @gestor/delphi-parser validate:scripts

      - name: Validate parser documentation
        run: pnpm --filter @gestor/delphi-parser validate:docs

      - name: Validate CI workflow
        run: pnpm --filter @gestor/delphi-parser validate:workflow

      - name: Validate fixture structure
        run: pnpm --filter @gestor/delphi-parser validate:fixtures

      - name: Build parser
        run: pnpm --filter @gestor/delphi-parser build

      - name: Validate component catalog
        run: pnpm --filter @gestor/delphi-parser validate:components

      - name: Audit fixture DFM components
        run: pnpm --filter @gestor/delphi-parser validate:fixture-components

      - name: Validate generated fixture artifacts
        run: pnpm --filter @gestor/delphi-parser validate:fixture-artifacts

      - name: Validate generated TypeScript syntax
        run: pnpm --filter @gestor/delphi-parser validate:fixture-syntax

      - name: Validate semantic fixture behavior
        run: pnpm --filter @gestor/delphi-parser validate:fixture-semantic
