name: Delphi Parser Fixtures

on:
  pull_request:
    paths:
      - 'packages/delphi-parser/**'
      - '.github/workflows/delphi-fixtures.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build parser
        run: pnpm --filter @gestor/delphi-parser build

      - name: Validate Delphi fixtures
        run: pnpm validate:delphi-fixtures
